# Local API and persistent MongoDB. Outside Compose with no MONGO_URI,
# development and tests still use an in-memory MongoDB.
#
# Start it:
#
#   docker compose up --build -d
#
# Stop it:
#
#   docker compose stop
#
# Reset the data volume:
#
#   docker compose down -v

services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/template-api
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Hong_Kong}
      ACADEMIC_CURRENT_TERM_CODE: ${ACADEMIC_CURRENT_TERM_CODE:-}
      AUTH_SKIP: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  academic-worker:
    build: .
    command: ["bun", "run", "worker:academic-refresh"]
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/template-api
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.3.4
    container_name: template-api-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
